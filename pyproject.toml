[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "normrag"
version = "0.1.0"
description = "Asistente de consulta sobre normativa de compras con citas verificables, abstención y evaluación"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fernando León Moloney" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=7"]

[project.scripts]
normrag = "normrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
